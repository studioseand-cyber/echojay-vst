name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git ../JUCE

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="../JUCE"

      - name: Build VST3
        run: cmake --build build --config Release --target EchoJay_VST3

      - name: List artifacts
        run: dir build\EchoJay_artefacts\Release /s
        shell: cmd

      - name: Stage installer files
        run: |
          mkdir installer-src\VST3
          xcopy /E /I "build\EchoJay_artefacts\Release\VST3\EchoJay.vst3" "installer-src\VST3\EchoJay.vst3\"
        shell: cmd

      - name: Create Inno Setup script
        run: |
          @"
          [Setup]
          AppName=EchoJay
          AppVersion=1.6.2
          AppPublisher=EchoJay
          AppPublisherURL=https://echojay.ai
          DefaultDirName={autopf}\EchoJay
          DefaultGroupName=EchoJay
          OutputDir=.
          OutputBaseFilename=EchoJay-v1.6.2-Windows-Installer
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          PrivilegesRequired=admin

          [Files]
          Source: "installer-src\VST3\EchoJay.vst3\*"; DestDir: "{commoncf}\VST3\EchoJay.vst3"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Uninstall EchoJay"; Filename: "{uninstallexe}"
          "@ | Out-File -FilePath installer.iss -Encoding ASCII
        shell: pwsh

      - name: Compile Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: EchoJay-Windows-Installer
          path: EchoJay-v1.6.2-Windows-Installer.exe

      - name: Create Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: EchoJay-v1.6.2-Windows-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
